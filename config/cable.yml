development:
  adapter: redis
  url: <%= ENV["REDIS_URL"].presence || "redis://#{ENV.fetch('REDIS_HOST', 'redis')}:#{ENV.fetch('REDIS_PORT', '6379')}/1" %>
  channel_prefix: hyrax_coar_notify_development

test:
  adapter: async

production:
  adapter: redis
  url: <%= ENV["REDIS_URL"].presence || "redis://#{ENV.fetch('REDIS_HOST', 'redis')}:#{ENV.fetch('REDIS_PORT', '6379')}/1" %>
  channel_prefix: hyrax_coar_notify_production
