:queues:
  - default
  - mailers

:max_retries: 5

# hyrax-coar-notify registers its own fetch schedule; sidekiq-scheduler only runs it in dynamic mode.
:scheduler:
  :dynamic: true

development:
  :concurrency: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  :concurrency: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
